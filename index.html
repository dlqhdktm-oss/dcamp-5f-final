<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>D·CAMP 4~5F 대관 투어 안내 매뉴얼</title>
<meta name="description" content="D·CAMP 마포 4~5층 대관 공간 투어 및 운영 안내 매뉴얼">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0c0f16;
  --bg2:#141820;
  --bg3:#1a1f2e;
  --card:#161b27;
  --card2:#1c2233;
  --text:#e8eaf0;
  --text2:#9ba3b5;
  --text3:#5c6478;
  --border:rgba(255,255,255,.06);
  --border2:rgba(255,255,255,.10);
  --border3:rgba(255,255,255,.15);
  --accent:#6c7bf7;
  --accent2:rgba(108,123,247,.12);
  --accent3:#818cf8;
  --green:#34d399;
  --green2:rgba(52,211,153,.12);
  --amber:#fbbf24;
  --amber2:rgba(251,191,36,.12);
  --red:#f87171;
  --red2:rgba(248,113,113,.10);
  --shadow:0 2px 8px rgba(0,0,0,.3),0 1px 3px rgba(0,0,0,.2);
  --shadow2:0 8px 32px rgba(0,0,0,.4);
  --glow:0 0 40px rgba(108,123,247,.08);
  --radius:16px;
  --radius-sm:10px;
}
html{scroll-behavior:smooth}
body{
  font-family:'Noto Sans KR','Outfit',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  line-height:1.6;
  min-height:100vh;
}
body::before{
  content:'';position:fixed;top:0;left:0;right:0;height:500px;
  background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(108,123,247,.07) 0%,transparent 70%);
  pointer-events:none;z-index:0;
}
.wrap{max-width:700px;margin:0 auto;padding:20px 16px 60px;position:relative;z-index:1}

/* Header */
header{text-align:center;padding:40px 0 28px;position:relative}
header::after{
  content:'';display:block;width:60px;height:2px;margin:0 auto;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  margin-top:20px;
}
header h1{
  font-family:'Outfit','Noto Sans KR',sans-serif;
  font-size:26px;font-weight:800;letter-spacing:-.3px;
  color:var(--text);
}
header h1 span{
  background:linear-gradient(135deg,var(--accent3),#a78bfa);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
header p{
  font-size:13px;color:var(--text3);font-weight:400;margin-top:6px;letter-spacing:.2px;
}

/* Map Section */
.map-section{margin:24px 0 0}
.map-grid{display:grid;grid-template-columns:1fr;gap:16px}
.map-wrap{
  background:var(--card);
  border:1px solid var(--border2);
  border-radius:var(--radius);
  padding:22px;
  box-shadow:var(--shadow);
  transition:border-color .3s;
}
.map-wrap:hover{border-color:var(--border3)}
.map-card-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:14px}
.map-card-title{font-family:'Outfit','Noto Sans KR',sans-serif;font-size:16px;font-weight:700;letter-spacing:-.2px;color:var(--text)}
.map-card-sub{font-size:11px;color:var(--text3);margin-top:3px}
.map-chip{
  display:inline-flex;align-items:center;
  padding:5px 12px;border-radius:999px;
  background:var(--accent2);border:1px solid rgba(108,123,247,.2);
  font-size:11px;font-weight:600;color:var(--accent3);white-space:nowrap;
}
.map-hint{text-align:center;font-size:11px;color:var(--text3);margin-top:10px;letter-spacing:.3px}
svg{display:block;width:100%;height:auto}
.room{cursor:pointer}
.room rect,.room polygon{transition:all .25s ease}
.room:hover rect,.room:hover polygon{filter:brightness(1.2);transform-origin:center}

/* Navigation */
.nav{
  display:flex;gap:6px;margin:18px 0;flex-wrap:wrap;
  position:sticky;top:0;z-index:10;
  background:rgba(12,15,22,.88);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  padding:12px 0;
  border-bottom:1px solid transparent;
  transition:border-color .2s;
}
.nav.stuck{border-bottom-color:var(--border2)}
.nav button{
  padding:7px 16px;font-size:12px;font-weight:600;
  border-radius:100px;
  border:1px solid var(--border2);
  background:var(--card);color:var(--text2);
  cursor:pointer;transition:all .2s;
  font-family:inherit;white-space:nowrap;
}
.nav button:hover{
  border-color:var(--border3);
  background:var(--card2);
  color:var(--text);
  transform:translateY(-1px);
  box-shadow:0 4px 12px rgba(0,0,0,.3);
}
.nav button.on{
  color:#fff;border-color:transparent;
  box-shadow:0 2px 12px rgba(0,0,0,.3);
}

/* Space Panel */
.space-panel{animation:slideUp .3s cubic-bezier(.22,.61,.36,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.space-header{
  display:flex;align-items:center;gap:14px;
  padding:24px 0 16px;
  border-bottom:1px solid var(--border2);
}
.space-icon{
  width:46px;height:46px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:800;color:#fff;flex-shrink:0;
  box-shadow:0 4px 16px rgba(0,0,0,.3);
}
.space-header h2{
  font-family:'Outfit','Noto Sans KR',sans-serif;
  font-size:19px;font-weight:800;letter-spacing:-.3px;
  color:var(--text);
}
.space-header .badge{
  font-size:10px;padding:3px 10px;border-radius:100px;
  font-weight:600;letter-spacing:.3px;margin-left:6px;
  vertical-align:middle;
}
.space-header .sub{font-size:12px;color:var(--text3);font-weight:400;margin-top:2px}

/* Sections (Accordion) */
.section{margin:12px 0 0}
.section-title{
  font-size:14px;font-weight:700;color:var(--text);
  padding:14px 0;border-bottom:1px solid var(--border);
  cursor:pointer;display:flex;align-items:center;gap:8px;
  user-select:none;transition:color .2s;
  letter-spacing:-.1px;
}
.section-title:hover{color:var(--accent3)}
.section-title::before{
  content:'';display:inline-block;
  width:6px;height:6px;
  border-right:2px solid var(--text3);border-bottom:2px solid var(--text3);
  transform:rotate(-45deg);
  transition:transform .25s;flex-shrink:0;
}
.section-title.open::before{transform:rotate(45deg)}
.section-body{overflow:hidden;max-height:0;transition:max-height .35s ease;padding:0}
.section-body.open{max-height:12000px;padding:10px 0}

/* Items */
.item{
  font-size:13px;line-height:1.9;color:var(--text2);
  padding:3px 0 3px 22px;position:relative;
}
.item::before{
  content:'';position:absolute;left:6px;top:13px;
  width:5px;height:5px;border-radius:50%;
  background:var(--text3);
  transition:background .2s;
}
.item.warn{color:var(--red);font-weight:500}
.item.warn::before{background:var(--red)}
.paragraph{font-size:13px;line-height:1.9;color:var(--text2);padding:3px 0}

/* Tables */
.table-wrap{
  overflow:auto;margin:10px 0 4px;
  border:1px solid var(--border2);
  border-radius:var(--radius-sm);
  background:var(--card);
}
.info-table{width:100%;border-collapse:collapse;font-size:12px}
.info-table th,.info-table td{
  padding:12px 14px;
  border-bottom:1px solid var(--border);
  vertical-align:top;text-align:left;
}
.info-table th{
  background:var(--bg3);font-weight:700;color:var(--text);
  font-size:11px;text-transform:uppercase;letter-spacing:.5px;
}
.info-table tr:last-child td{border-bottom:0}
.info-table td:first-child{
  font-weight:600;color:var(--text);white-space:nowrap;min-width:110px;
}
.info-table tr{transition:background .15s}
.info-table tbody tr:hover{background:rgba(255,255,255,.02)}

/* Note Box */
.note-box{
  margin:12px 0 4px;padding:14px 16px;
  border-radius:var(--radius-sm);
  border:1px solid rgba(248,113,113,.15);
  background:var(--red2);
  color:#fca5a5;font-size:12px;line-height:1.8;
}
.note-box.neutral{
  border-color:var(--border2);
  background:var(--bg3);
  color:var(--text2);
}
.note-box strong{display:block;font-size:12px;font-weight:700;margin-bottom:4px;color:inherit}

/* Route Summary */
.route-summary{
  margin:14px 0 12px;padding:16px 18px;
  border-radius:var(--radius);
  background:linear-gradient(135deg,rgba(108,123,247,.08),rgba(167,139,250,.06));
  border:1px solid rgba(108,123,247,.18);
  box-shadow:var(--glow);
}
.route-label{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 12px;border-radius:999px;
  background:var(--accent2);
  color:var(--accent3);font-size:11px;font-weight:700;letter-spacing:.2px;
}
.route-label::before{content:"→";font-weight:900}
.route-copy{margin-top:10px;font-size:14px;line-height:1.8;color:var(--text);font-weight:700;letter-spacing:-.2px}
.route-subcopy{margin-top:6px;font-size:12px;line-height:1.7;color:var(--text3)}

.route-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.route-step{
  background:var(--card);border:1px solid var(--border2);
  border-radius:var(--radius-sm);padding:14px 12px 12px;
  box-shadow:var(--shadow);transition:border-color .2s;
}
.route-step:hover{border-color:var(--border3)}
.route-step-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.route-step-no{
  width:24px;height:24px;border-radius:999px;
  background:var(--accent);color:#fff;
  font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.route-step-title{font-size:12px;font-weight:700;color:var(--text);letter-spacing:-.2px}
.route-step-body{font-size:12px;line-height:1.7;color:var(--text2)}

/* Guide Card */
.guide-card{
  margin:12px 0 4px;
  border:1px solid var(--border2);
  border-radius:var(--radius);
  background:var(--card);overflow:hidden;
  box-shadow:var(--shadow);
}
.guide-card.route-guide{border-color:rgba(108,123,247,.15)}
.guide-visual{border-bottom:1px solid var(--border)}
.guide-visual img{display:block;width:100%;height:auto}
.guide-meta{padding:14px 16px}
.guide-title{font-family:'Outfit','Noto Sans KR',sans-serif;font-size:16px;font-weight:800;letter-spacing:-.3px}
.guide-text{font-size:12px;color:var(--text2);margin-top:4px;line-height:1.7}
.guide-keypoints{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.guide-chip{
  display:inline-flex;align-items:center;
  padding:5px 12px;border-radius:999px;
  background:var(--bg3);border:1px solid var(--border2);
  font-size:11px;font-weight:600;color:var(--text2);
}
.guide-image-link{display:block;text-decoration:none}
.guide-image-hint{margin-top:8px;font-size:12px;color:var(--text3);text-align:right}

/* Reference Gallery */
.ref-gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 4px}
.ref-card{
  border:1px solid var(--border2);border-radius:var(--radius-sm);
  overflow:hidden;background:var(--card);box-shadow:var(--shadow);
  transition:border-color .2s,transform .2s;
}
.ref-card:hover{border-color:var(--border3);transform:translateY(-2px)}
.ref-card img{display:block;width:100%;height:200px;object-fit:cover}
.ref-card-caption{padding:10px 12px;font-size:11px;color:var(--text3);line-height:1.5}
.ref-card-caption strong{color:var(--text2);font-weight:600;display:block;margin-bottom:2px}
@media(max-width:640px){
  .ref-gallery{grid-template-columns:1fr}
  .ref-card img{height:240px}
}

/* Archive Timeline */
.archive-item{
  margin:14px 0;border:1px solid var(--border2);border-radius:var(--radius);
  background:var(--card);overflow:hidden;box-shadow:var(--shadow);
  transition:border-color .2s;
}
.archive-item:hover{border-color:var(--border3)}
.archive-header{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;border-bottom:1px solid var(--border);
}
.archive-date{
  padding:4px 10px;border-radius:8px;
  background:var(--accent2);border:1px solid rgba(108,123,247,.18);
  font-size:11px;font-weight:700;color:var(--accent3);
  white-space:nowrap;flex-shrink:0;
}
.archive-title{font-size:14px;font-weight:700;color:var(--text);letter-spacing:-.2px}
.archive-tag{
  margin-left:auto;padding:3px 10px;border-radius:999px;
  font-size:10px;font-weight:600;white-space:nowrap;
}
.archive-body{padding:14px 16px}
.archive-body p{font-size:13px;color:var(--text2);line-height:1.8;margin-bottom:6px}
.archive-images{display:grid;gap:10px;margin-top:12px}
.archive-images.cols-2{grid-template-columns:1fr 1fr}
.archive-images.cols-1{grid-template-columns:1fr}
.archive-img-wrap{
  border-radius:var(--radius-sm);overflow:hidden;
  border:1px solid var(--border);position:relative;
}
.archive-img-wrap img{display:block;width:100%;height:auto}
.archive-img-label{
  position:absolute;bottom:0;left:0;right:0;
  padding:8px 12px;
  background:linear-gradient(transparent,rgba(0,0,0,.7));
  font-size:11px;color:rgba(255,255,255,.85);font-weight:500;
}
@media(max-width:640px){
  .archive-images.cols-2{grid-template-columns:1fr}
}

/* Footer */
.footer{
  text-align:center;padding:28px 0 0;
  border-top:1px solid var(--border);margin-top:36px;
}
.footer p{font-size:11px;color:var(--text3)}

/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border3);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}

/* Selection */
::selection{background:rgba(108,123,247,.3);color:#fff}

@media (max-width:640px){
  .wrap{padding:16px 12px 48px}
  header{padding:28px 0 20px}
  header h1{font-size:22px}
  .map-wrap{padding:16px}
  .space-header{align-items:flex-start}
  .route-steps{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span>D·CAMP</span> 4~5F 대관 투어 안내 매뉴얼</h1>
    <p>층별 공간 구조와 운영 기준을 분리해 확인할 수 있도록 정리한 문서</p>
  </header>

  <div class="map-section">
    <div class="map-grid">
    <div class="map-wrap">
      <div class="map-card-head">
        <div>
          <div class="map-card-title">5층 대관 도면</div>
          <div class="map-card-sub">박병원홀, A/C 창고, 세미나 A, 컨퍼런스룸</div>
        </div>
        <div class="map-chip">운영 기준: 5F</div>
      </div>
      <svg viewBox="0 0 520 440" id="floormap-5f" aria-label="D.CAMP 5F floor map">
        <defs>
          <linearGradient id="room5g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6c7bf7"/><stop offset="100%" stop-color="#818cf8"/></linearGradient>
          <linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(255,255,255,.04)"/><stop offset="100%" stop-color="transparent"/></linearGradient>
        </defs>
        <rect x="20" y="20" width="480" height="400" rx="12" fill="#141820" stroke="rgba(255,255,255,.06)" stroke-width="1.5"/>
        <rect x="20" y="20" width="480" height="400" rx="12" fill="url(#hg)"/>
        <text x="32" y="16" font-size="13" font-weight="800" fill="#5c6478" font-family="Outfit,Noto Sans KR,sans-serif" letter-spacing="2">5F</text>

        <rect x="38" y="38" width="444" height="364" rx="8" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="1.5"/>

        <g class="room" data-id="storage">
          <rect x="56" y="56" width="112" height="56" rx="8" fill="#1c2233" stroke="rgba(255,255,255,.06)" stroke-width="1"/>
          <text x="112" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#9ba3b5" font-family="Noto Sans KR,sans-serif">A/C 창고</text>
          <text x="112" y="100" text-anchor="middle" font-size="9" fill="#5c6478" font-family="Noto Sans KR,sans-serif">지원 공간</text>
        </g>

        <rect x="180" y="56" width="160" height="56" rx="8" fill="#141820" stroke="rgba(255,255,255,.06)" stroke-width="1"/>
        <text x="260" y="82" text-anchor="middle" font-size="10" font-weight="600" fill="#5c6478" font-family="Noto Sans KR,sans-serif">공용홀 / 복도</text>
        <text x="260" y="98" text-anchor="middle" font-size="9" fill="#3d4557" font-family="Noto Sans KR,sans-serif">엘리베이터 홀 인접</text>

        <g class="room" data-id="storage">
          <rect x="352" y="56" width="112" height="56" rx="8" fill="#1c2233" stroke="rgba(255,255,255,.06)" stroke-width="1"/>
          <text x="408" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#9ba3b5" font-family="Noto Sans KR,sans-serif">A/C 창고</text>
          <text x="408" y="100" text-anchor="middle" font-size="9" fill="#5c6478" font-family="Noto Sans KR,sans-serif">지원 공간</text>
        </g>

        <g class="room" data-id="bahk">
          <rect x="56" y="132" width="246" height="194" rx="10" fill="url(#room5g)" opacity=".85"/>
          <text x="179" y="222" text-anchor="middle" font-size="19" font-weight="900" fill="#fff" font-family="Outfit,Noto Sans KR,sans-serif">박병원홀</text>
          <text x="179" y="246" text-anchor="middle" font-size="11" fill="rgba(255,255,255,.6)" font-family="Noto Sans KR,sans-serif">Bahk Byongwon Hall</text>
          <text x="179" y="266" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.4)" font-family="Noto Sans KR,sans-serif">메인 대관 공간</text>
        </g>

        <g class="room" data-id="seminar5">
          <rect x="320" y="132" width="144" height="92" rx="10" fill="url(#room5g)" opacity=".7"/>
          <text x="392" y="176" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" font-family="Outfit,Noto Sans KR,sans-serif">세미나 A</text>
          <text x="392" y="196" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.55)" font-family="Noto Sans KR,sans-serif">5층 세미나실</text>
        </g>

        <g class="room" data-id="conference">
          <rect x="320" y="234" width="144" height="92" rx="10" fill="url(#room5g)" opacity=".55"/>
          <text x="392" y="278" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" font-family="Outfit,Noto Sans KR,sans-serif">컨퍼런스룸</text>
          <text x="392" y="298" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.5)" font-family="Noto Sans KR,sans-serif">Conference Room</text>
        </g>

        <rect x="168" y="340" width="184" height="44" rx="8" fill="#141820" stroke="rgba(255,255,255,.06)" stroke-width="1"/>
        <text x="260" y="366" text-anchor="middle" font-size="10" font-weight="600" fill="#5c6478" font-family="Noto Sans KR,sans-serif">출입 / 엘리베이터 홀</text>

        <g transform="translate(260,402)">
          <polygon points="0,14 8,0 -8,0" fill="var(--accent)"/>
          <text x="0" y="-6" text-anchor="middle" font-size="9" fill="var(--accent3)" font-weight="700" font-family="Outfit,sans-serif" letter-spacing="1">HERE</text>
        </g>
      </svg>
      <div class="map-hint">공간을 클릭하면 해당 5층 상세 정보로 이동합니다</div>
    </div>

    <div class="map-wrap">
      <div class="map-card-head">
        <div>
          <div class="map-card-title">4층 대관 도면</div>
          <div class="map-card-sub">세미나실 A / B / C는 각각 별도 대관 상품으로 안내</div>
        </div>
        <div class="map-chip">운영 기준: 4F</div>
      </div>

const FIGURE_KEYS=new Set(["trash-guide","nvidia-ref","archive-nvidia","archive-nav"]);

function buildNav(content){
  return content.spaces
    .slice()
    .sort((a,b)=>(a.order??999)-(b.order??999))
    .map(space=>({
      id:space.id,
      label:NAV_STYLE[space.id]?.label||space.name,
      c:NAV_STYLE[space.id]?.c||"var(--accent)"
    }));
}

function blocksToLegacySection(section){
  const legacy={t:section.title};
  (section.blocks||[]).forEach(block=>{
    if(block.type==="paragraph")legacy.text=block.content||[];
    if(block.type==="items")legacy.items=block.items||[];
    if(block.type==="table")legacy.table={headers:block.headers||[],rows:block.rows||[]};
    if(block.type==="note"){
      legacy.note=block.content||[];
      if(block.noteTitle)legacy.noteTitle=block.noteTitle;
      if(block.noteStyle)legacy.noteStyle=block.noteStyle;
    }
    if(block.type==="figure")legacy.figure=block.figureKey;
  });
  return legacy;
}

function hydrateContent(content){
  validateContent(content);
  const spaces={};
  content.spaces
    .slice()
    .sort((a,b)=>(a.order??999)-(b.order??999))
    .forEach(space=>{
      spaces[space.id]={
        ...space,
        ...(SPACE_DESIGN[space.id]||{}),
        sections:(space.sections||[])
          .slice()
          .sort((a,b)=>(a.order??999)-(b.order??999))
          .map(blocksToLegacySection)
      };
    });
  return spaces;
}

function validateContent(content){
  if(!content||!Array.isArray(content.spaces))throw new Error("content.json에 spaces 배열이 없습니다.");
  const ids=new Set();
  content.spaces.forEach(space=>{
    if(!space.id)throw new Error("space.id가 비어 있습니다.");
    if(ids.has(space.id))throw new Error(`space.id가 중복되었습니다: ${space.id}`);
    ids.add(space.id);
    if(!space.name)throw new Error(`space.name이 비어 있습니다: ${space.id}`);
    if(!Array.isArray(space.sections))throw new Error(`sections 배열이 없습니다: ${space.id}`);
    space.sections.forEach(section=>{
      if(!section.title)throw new Error(`section.title이 비어 있습니다: ${space.id}`);
      if(!Array.isArray(section.blocks))throw new Error(`blocks 배열이 없습니다: ${space.id} / ${section.title}`);
      section.blocks.forEach(block=>{
        if(!["paragraph","items","table","note","figure"].includes(block.type)){
          throw new Error(`지원하지 않는 block.type입니다: ${block.type}`);
        }
        if(block.type==="figure"&&!FIGURE_KEYS.has(block.figureKey)){
          throw new Error(`지원하지 않는 figure_key입니다: ${block.figureKey}`);
        }
      });
    });
  });
}

function renderLoading(){

}

}

async function loadContent(){
  renderLoading();
  const url=new URL("content.json",location.href);
  url.searchParams.set("v",Date.now().toString());
  const response=await fetch(url);
  if(!response.ok)throw new Error(`content.json 응답 오류: ${response.status}`);
  const content=await response.json();
  SPACES=hydrateContent(content);
  NAV=buildNav(content);
  if(!SPACES[current])current=NAV[0]?.id||"overview";
  renderAll();
}

function escapeHtml(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#39;")}
function renderItems(items){return items.map(it=>{const w=String(it).startsWith("⚠️");return`<div class="item${w?" warn":""}">${escapeHtml(it)}</div>`}).join("")}
function renderParagraphs(text){return(Array.isArray(text)?text:[text]).map(l=>`<p class="paragraph">${escapeHtml(l)}</p>`).join("")}
function renderTable(table){const head=table.headers.map(h=>`<th>${escapeHtml(h)}</th>`).join("");const rows=table.rows.map(row=>`<tr>${row.map(cell=>`<td>${escapeHtml(cell)}</td>`).join("")}</tr>`).join("");return`<div class="table-wrap"><table class="info-table"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`}

function renderSectionContent(s){let h="";if(s.text)h+=renderParagraphs(s.text);if(s.table)h+=renderTable(s.table);if(s.items)h+=renderItems(s.items);if(s.note)h+=renderNote(s);if(s.figure==="trash-guide")h+=renderTrashGuide();if(s.figure==="nvidia-ref")h+=renderNvidiaRef();if(s.figure==="archive-nvidia")h+=renderArchiveNvidia();if(s.figure==="archive-nav")h+=renderArchiveNav();return h}

function renderNav(){const nav=document.getElementById("nav");nav.innerHTML="";NAV.forEach(n=>{const b=document.createElement("button");b.textContent=n.label;if(current===n.id){b.className="on";b.style.background=n.c;b.style.borderColor=n.c}b.onclick=()=>{current=n.id;renderAll()};nav.appendChild(b)})}

function renderContent(){const el=document.getElementById("content");const d=SPACES[current];if(!d){el.innerHTML="";return}let h=`<div class="space-panel"><div class="space-header"><div class="space-icon" style="background:${d.iconBg}">${d.icon}</div><div><h2>${escapeHtml(d.name)} <span class="badge" style="background:${d.badgeBg};color:${d.badgeC}">${escapeHtml(d.tag)}</span></h2><div class="sub">${escapeHtml(d.sub)}</div></div></div>`;d.sections.forEach((s,i)=>{h+=`<div class="section"><div class="section-title${i===0?" open":""}" data-open="${i===0}" onclick="toggleSection(this)">${escapeHtml(s.t)}</div><div class="section-body${i===0?" open":""}">${renderSectionContent(s)}</div></div>`});h+=`</div>`;el.innerHTML=h}

function renderAll(){renderNav();renderContent()}
window.toggleSection=function(el){el.classList.toggle("open");const body=el.nextElementSibling;if(body)body.classList.toggle("open")};

document.querySelectorAll(".room").forEach(room=>{room.addEventListener("click",()=>{const nextId=room.dataset.id;if(!SPACES[nextId])return;current=nextId;renderAll();document.getElementById("nav").scrollIntoView({behavior:"smooth",block:"start"})})});

const navEl=document.getElementById("nav");
const observer=new IntersectionObserver(([entry])=>{navEl.classList.toggle("stuck",!entry.isIntersecting)},{threshold:[1],rootMargin:"-1px 0px 0px 0px"});
observer.observe(navEl);
loadContent().catch(renderLoadError);
</script>
</body>
</html>
